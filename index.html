<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>Drive HTML Claude Viewer</title>
  <!-- Google Fonts: Roboto (UI), Noto Sans JP (日本語), Roboto Mono (code) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500&family=Roboto:wght@400;500&family=Roboto+Mono:wght@400&display=swap" rel="stylesheet">

  <?!= include('styles-base'); ?>
  <?!= include('styles-viewer'); ?>
</head>
<body>

  <!-- TOP APP BAR -->
  <header class="app-header">
    <div class="brand">
      <svg class="brand-logo" viewBox="0 0 40 40" aria-hidden="true">
        <path class="logo-tab" d="M6 10a3 3 0 0 1 3-3h7.2l3 3H31a3 3 0 0 1 3 3v1H6z"/>
        <rect class="logo-folder" x="6" y="12" width="28" height="21" rx="3"/>
        <path class="logo-glyph" d="M17.2 26.6 13 22.5l4.2-4.1 1.3 1.3-2.8 2.8 2.8 2.8zm5.6 0-1.3-1.3 2.8-2.8-2.8-2.8 1.3-1.3 4.2 4.1z"/>
      </svg>
      <span class="brand-title">Drive HTML Viewer</span>
    </div>

    <div class="search-wrapper">
      <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
      </svg>
      <input type="text" id="search-input" class="search-input" placeholder="このフォルダ内を絞り込み" aria-label="このフォルダ内を絞り込み" disabled>
    </div>

    <div class="header-actions">
      <div class="status-container" id="status-container" role="status" title="GAS API 接続完了">
        <div class="status-dot" id="status-dot"></div>
        <span id="status-text">GAS API 接続完了</span>
      </div>
      <button id="btn-sync" class="icon-btn" title="このフォルダを再読み込み" aria-label="このフォルダを再読み込み" disabled>
        <svg id="sync-icon" viewBox="0 0 24 24" class="spinning">
          <path d="M17.65 6.35C16.2 4.9 14.21 4 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.07 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/>
        </svg>
      </button>
    </div>
  </header>

  <div class="app-layout">

    <!-- A. FILE BROWSER -->
    <aside class="sidebar surface-card">
      <div class="browser-header">
        <nav class="breadcrumb" id="breadcrumb" aria-label="フォルダ階層"></nav>
      </div>

      <div class="sidebar-meta-row">
        <div class="file-count" id="file-count">読み込み中...</div>
      </div>

      <div class="list-columns" aria-hidden="true">
        <span class="col-name">名前</span>
        <span class="col-date">最終更新</span>
        <span class="col-size">サイズ</span>
      </div>

      <div class="file-list" id="file-list">
        <div class="list-spinner-container" id="list-spinner">
          <div class="spinner"></div>
          <span class="list-spinner-text">ドライブをロード中...</span>
        </div>
      </div>
    </aside>

    <!-- B. VIEWER -->
    <main class="main-content surface-card">

      <!-- File header -->
      <section class="top-meta-card" id="top-meta-card">
        <div class="meta-header-left">
          <svg class="file-header-icon" viewBox="0 0 24 24" aria-hidden="true">
            <rect class="ic-html-bg" x="3" y="3" width="18" height="18" rx="2"/>
            <path class="ic-html-glyph" d="M10.1 15.5 6.6 12l3.5-3.5 1.1 1.1L8.8 12l2.4 2.4zm3.8 0-1.1-1.1 2.4-2.4-2.4-2.4 1.1-1.1 3.5 3.5z"/>
          </svg>
          <h1 class="active-file-title" id="active-file-title">ファイルを読み込んでください</h1>
          <span class="active-badge" id="active-badge">未選択</span>
        </div>

        <div class="meta-header-right" id="top-meta-metrics" style="opacity: 0.38; pointer-events: none;">
          <div class="meta-metrics-grid">
            <div class="meta-item-box">
              <span class="meta-box-label">サイズ</span>
              <span class="meta-box-val" id="meta-size">-</span>
            </div>
            <div class="meta-item-box">
              <span class="meta-box-label">最終更新</span>
              <span class="meta-box-val" id="meta-updated">-</span>
            </div>
          </div>
          <a id="meta-drive-url" href="#" target="_blank" rel="noopener noreferrer" class="btn-tonal" title="Googleドライブで開く">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M19 19H5V5h7V3H5c-1.11 0-2 .9-2 2v14c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2v-7h-2v7zM14 3v2h3.59l-9.83 9.83 1.41 1.41L19 6.41V10h2V3h-7z"/>
            </svg>
            ドライブで開く
          </a>
        </div>
      </section>

      <!-- Viewer -->
      <div class="workspace-window">
        <div class="window-header">
          <div class="tabs-wrapper" role="group" aria-label="表示モード">
            <button id="tab-preview" class="tab-btn active" aria-pressed="true" onclick="switchTab('preview')">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/>
              </svg>
              プレビュー
            </button>
            <button id="tab-source" class="tab-btn" aria-pressed="false" onclick="switchTab('source')">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M9.4 16.6L4.8 12l4.6-4.6L8 6l-6 6 6 6 1.4-1.4zm5.2 0l4.6-4.6-4.6-4.6L16 6l6 6-6 6-1.4-1.4z"/>
              </svg>
              ソース
            </button>
          </div>

          <div class="address-bar">
            <svg class="address-icon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/>
            </svg>
            <span id="address-file-name">https://drive.google.com/viewer/sandbox</span>
          </div>

          <div id="device-controls" class="device-toolbar">
            <button id="device-desktop" class="icon-btn device-btn active" onclick="setDeviceWidth('desktop')" title="PC表示 (100%)" aria-label="PC表示">
              <svg viewBox="0 0 24 24">
                <path d="M21 2H3c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h7l-2 3v1h8l-2-3h7c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm0 14H3V4h18v12z"/>
              </svg>
            </button>
            <button id="device-tablet" class="icon-btn device-btn" onclick="setDeviceWidth('tablet')" title="タブレット表示 (768px)" aria-label="タブレット表示">
              <svg viewBox="0 0 24 24">
                <path d="M18.5 0h-13C3.57 0 2 1.57 2 3.5v17C2 22.43 3.57 24 5.5 24h13c1.93 0 3.5-1.57 3.5-3.5v-17C22 1.57 20.43 0 18.5 0zm-13 2h13c.83 0 1.5.67 1.5 1.5v15H4v-15C4 2.67 4.67 2 5.5 2zm13 20h-13c-.83 0-1.5-.67-1.5-1.5v-1.5h16v1.5c0 .83-.67 1.5-1.5 1.5z"/>
              </svg>
            </button>
            <button id="device-mobile" class="icon-btn device-btn" onclick="setDeviceWidth('mobile')" title="スマートフォン表示 (375px)" aria-label="スマートフォン表示">
              <svg viewBox="0 0 24 24">
                <path d="M17 1.01L7 1c-1.1 0-2 .9-2 2v18c0 1.1.9 2 2 2h10c1.1 0 2-.9 2-2V3c0-1.1-.9-1.99-2-1.99zM17 19H7V5h10v14z"/>
              </svg>
            </button>
          </div>
        </div>

        <div class="window-body">

          <!-- EMPTY STATE -->
          <div id="overlay-empty" class="viewport-overlay">
            <div class="overlay-illustration">
              <svg class="overlay-svg" viewBox="0 0 24 24" aria-hidden="true">
                <rect class="ic-html-bg" x="3" y="3" width="18" height="18" rx="2"/>
                <path class="ic-html-glyph" d="M10.1 15.5 6.6 12l3.5-3.5 1.1 1.1L8.8 12l2.4 2.4zm3.8 0-1.1-1.1 2.4-2.4-2.4-2.4 1.1-1.1 3.5 3.5z"/>
              </svg>
            </div>
            <div class="overlay-title">ファイルを選択してください</div>
            <div class="overlay-desc">左側の一覧から、表示したいHTMLファイルをクリックしてください。</div>
          </div>

          <!-- LOADING STATE -->
          <div id="overlay-loading" class="viewport-overlay hidden">
            <div class="spinner"></div>
            <div class="overlay-title" id="loading-title">ファイルを読み込み中...</div>
            <div class="overlay-desc" id="loading-desc">Google Drive APIからファイルデータをロードしています。</div>
          </div>

          <!-- SANDBOXED IFRAME -->
          <div id="iframe-container" class="iframe-holder">
            <iframe id="viewer-iframe" sandbox="allow-scripts" title="HTMLプレビュー"></iframe>
          </div>

          <!-- SOURCE VIEW -->
          <div id="source-container" class="source-panel">
            <div class="code-action-overlay">
              <button id="btn-copy-code" class="icon-btn btn-action-code" title="コードをコピー" aria-label="コードをコピー" onclick="copySourceCode()">
                <svg viewBox="0 0 24 24">
                  <path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/>
                </svg>
              </button>
            </div>
            <pre><code id="source-code-block">コードは読み込まれていません。</code></pre>
          </div>

        </div>
      </div>
    </main>

  </div>

  <!-- Snackbar container -->
  <div class="toast-container" id="toast-container" aria-live="polite"></div>

  <?!= include('scripts'); ?>
</body>
</html>
